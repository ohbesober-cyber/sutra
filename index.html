<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>능엄주 독송 · 감지금니</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-deep:#10152a;
    --indigo:#1a2140;
    --indigo-panel:#202950;
    --gold:#e8c15a;
    --gold-bright:#f6d98a;
    --ink-dim:#525e85;
    --ink-mid:#8d97bd;
    --line:#2c3560;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  @supports (height:100dvh){ html,body{height:100dvh;} }
  body{position:fixed;inset:0;width:100%;}
  body{
    background:var(--indigo-deep);
    color:var(--ink-mid);
    font-family:'Gowun Batang','Noto Serif KR',serif;
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ── 상단 표제 ── */
  header{
    padding:14px 20px 10px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:var(--indigo);
    flex:0 0 auto;
  }
  header h1{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:.5em;
    text-indent:.5em;
    color:var(--gold);
  }
  header p{font-size:.72rem;color:var(--ink-dim);letter-spacing:.25em;margin-top:4px;}

  /* ── 경문 영역 ── */
  #scroll{
    flex:1 1 auto;
    overflow-y:auto;
    padding:9vh 6vw 40vh;
    scroll-behavior:smooth;
  }
  #text{
    max-width:680px;margin:0 auto;
    font-size:var(--fs,2rem);
    line-height:2.1;
    letter-spacing:.06em;
    word-break:keep-all;
    text-align:center;
    color:var(--ink-dim);
    font-weight:400;
  }
  #text .ln{display:block;margin-bottom:.35em;}
  #text .hd{
    display:block;
    font-family:'Noto Serif KR',serif;
    font-size:.55em;
    color:var(--gold);
    letter-spacing:.3em;
    border-bottom:1px solid var(--line);
    padding-bottom:.5em;
    margin:2.2em 0 1.2em;
  }
  #text .gap{display:block;height:.8em;}
  #text .ln.reccur{
    background:rgba(232,193,90,.08);
    border-left:3px solid var(--gold);
    padding-left:.4em;margin-left:-.4em;border-radius:4px;
  }
  #text .ln.recdone{opacity:.55;}

  /* ── 싱크 녹화 바 ── */
  #recBar{
    display:none;flex:0 0 auto;
    background:var(--indigo);border-top:1px solid var(--gold);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    text-align:center;
  }
  #recBar.open{display:block;}
  #recBar .hint{font-size:.72rem;color:var(--ink-dim);margin-bottom:10px;letter-spacing:.05em;line-height:1.6;}
  #recTap{
    font-size:1.05rem;padding:16px 0;width:100%;max-width:420px;
    background:var(--gold);color:#241c05;border:none;border-radius:12px;
    font-weight:700;letter-spacing:.1em;cursor:pointer;font-family:inherit;
  }
  #recTap:active{transform:scale(.98);}
  #recBar .sub{display:flex;gap:10px;justify-content:center;margin-top:10px;}
  #syncBadge{font-size:.72rem;color:var(--gold);letter-spacing:.05em;}
  #text .ch{transition:color .12s linear, text-shadow .3s;}
  #text .ch.done{
    color:var(--gold);
    text-shadow:0 0 14px rgba(232,193,90,.28);
  }
  #text .ch.cur{
    color:var(--gold-bright);
    text-shadow:0 0 20px rgba(246,217,138,.55);
  }

  /* ── 제어부 ── */
  #panel{
    flex:0 0 auto;
    background:var(--indigo);
    border-top:1px solid var(--line);
    padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .row{display:flex;align-items:center;gap:8px;max-width:680px;margin:0 auto 7px;flex-wrap:wrap;justify-content:center;}
  .row:last-child{margin-bottom:0;}

  #bar{
    width:100%;max-width:680px;margin:0 auto 9px;
    height:3px;background:var(--line);border-radius:2px;cursor:pointer;position:relative;
  }
  #barFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:2px;}

  button{
    font-family:inherit;
    background:transparent;
    color:var(--ink-mid);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 13px;
    font-size:.82rem;
    cursor:pointer;
    letter-spacing:.06em;
    white-space:nowrap;
  }
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  button.primary{
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#241c05;border-color:var(--gold);
    font-weight:700;flex:1;max-width:220px;padding:8px 0;font-size:.95rem;
    box-shadow:0 2px 10px rgba(232,193,90,.22);
  }
  button.on{color:var(--gold);border-color:var(--gold);}

  label.small{font-size:.75rem;color:var(--ink-dim);display:flex;align-items:center;gap:6px;letter-spacing:.05em;}
  input[type=range]{accent-color:var(--gold);width:110px;}
  input[type=text]{
    font-family:inherit;background:var(--indigo-panel);border:1px solid var(--line);
    color:var(--ink-mid);border-radius:6px;padding:6px 8px;width:70px;font-size:.85rem;text-align:center;
  }
  #timeLabel{font-variant-numeric:tabular-nums;font-size:.76rem;color:var(--ink-dim);text-align:center;}
  #more{
    display:none;
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--indigo-panel);
    border-top:1px solid var(--gold);
    border-radius:16px 16px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.55);
    max-height:70%;overflow-y:auto;
  }
  #more.open{display:block;}
  #more .close{width:100%;max-width:680px;display:block;margin:0 auto 4px;}
  #fileName{font-size:.72rem;color:var(--ink-dim);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ── 편집 모달 ── */
  #editor{
    position:fixed;inset:0;background:rgba(10,13,26,.92);
    display:none;flex-direction:column;padding:20px;z-index:10;
  }
  #editor.open{display:flex;}
  #editor h2{font-size:.95rem;color:var(--gold);letter-spacing:.2em;margin-bottom:10px;text-align:center;}
  #editor textarea{
    flex:1;background:var(--indigo);border:1px solid var(--line);border-radius:10px;
    color:var(--ink-mid);font-family:inherit;font-size:1rem;line-height:1.9;
    padding:16px;resize:none;letter-spacing:.05em;
  }
  #editor .row{margin-top:12px;}
  #editor p.hint{font-size:.72rem;color:var(--ink-dim);text-align:center;margin-top:8px;line-height:1.7;}

  /* ── 밝은 낮 테마 (백지금니) ── */
  body.light{
    --indigo-deep:#faf6ec;
    --indigo:#f3ecdc;
    --indigo-panel:#fbf7ee;
    --gold:#a97f22;
    --gold-bright:#c39a2f;
    --ink-dim:#c2b79c;
    --ink-mid:#6e6450;
    --line:#e5dbc3;
  }
  body.light #text .ch.done{text-shadow:0 0 8px rgba(169,127,34,.18);}
  body.light #text .ch.cur{color:#8a6318;text-shadow:0 0 10px rgba(169,127,34,.3);}
  body.light #barFill{background:linear-gradient(90deg,#c39a2f,#a97f22);}

  /* ── 달력 ── */
  #calOverlay{
    position:fixed;inset:0;background:rgba(10,13,26,.94);
    display:none;flex-direction:column;align-items:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    overflow-y:auto;z-index:30;
  }
  body.light #calOverlay{background:rgba(245,238,225,.96);}
  #calOverlay.open{display:flex;}
  #calCard{width:100%;max-width:420px;}
  #calHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  #calHead h2{font-family:'Noto Serif KR',serif;color:var(--gold);font-size:1.05rem;letter-spacing:.15em;}
  #calHead button{padding:8px 14px;}
  #calGrid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
    background:var(--indigo);border:1px solid var(--line);border-radius:12px;padding:12px 8px;
  }
  .dow{font-size:.7rem;color:var(--ink-dim);text-align:center;padding:4px 0;}
  .dow.sun{color:#c97b7b;}
  .day{
    aspect-ratio:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    font-size:.82rem;color:var(--ink-mid);border-radius:8px;cursor:pointer;
  }
  .day.out{opacity:.22;}
  .day.today{outline:1px solid var(--gold);}
  .day.sel{background:var(--indigo-panel);outline:1px solid var(--gold-bright);}
  .day .mark{
    min-width:15px;height:15px;border-radius:50%;
    font-size:.62rem;line-height:15px;text-align:center;
    color:transparent;background:transparent;
  }
  .day.done{color:var(--gold-bright);}
  .day.done .mark{
    background:var(--gold);color:#241c05;font-weight:700;
    box-shadow:0 0 8px rgba(232,193,90,.5);
  }
  #calStats{text-align:center;font-size:.8rem;color:var(--ink-dim);margin-top:14px;line-height:1.8;}
  #calStats b{color:var(--gold);}
  #calEdit{
    display:none;margin-top:14px;
    background:var(--indigo);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;align-items:center;justify-content:center;gap:14px;
  }
  #calEdit.open{display:flex;}
  #calEdit span{font-size:.85rem;color:var(--ink-mid);}
  #calEdit b{color:var(--gold);font-size:1.05rem;min-width:52px;}
  #calEdit button{padding:6px 16px;font-size:1rem;}
  #rangeBox{
    margin-top:14px;background:var(--indigo);
    border:1px solid var(--line);border-radius:12px;padding:12px;
  }
  #rangeBox .rrow{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:8px;font-size:.8rem;color:var(--ink-dim);}
  #rangeBox input[type=date]{
    font-family:inherit;background:var(--indigo-panel);color:var(--ink-mid);
    border:1px solid var(--line);border-radius:8px;padding:7px;font-size:.82rem;
  }
  #rgResult{font-size:.8rem;color:var(--ink-mid);text-align:center;line-height:1.9;}
  #rgResult b{color:var(--gold);}
  #calClose{margin-top:18px;width:100%;max-width:420px;}
  #cntBadge{font-size:.72rem;color:var(--gold);letter-spacing:.05em;}
  select{
    font-family:inherit;background:var(--indigo-panel);color:var(--ink-mid);
    border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85rem;
  }

  @media (prefers-reduced-motion:reduce){
    #scroll{scroll-behavior:auto;}
    #text .ch{transition:none;}
  }
  @media (max-width:480px){
    #text{font-size:calc(var(--fs,2rem) * .82);}
    input[type=range]{width:80px;}
  }
</style>
</head>
<body>

<header>
  <h1>수능엄신주</h1>
  <p>白傘蓋陀羅尼 · 紺紙金泥</p>
  <p style="letter-spacing:.06em;margin-top:6px;">− 음을 길게 &nbsp;·&nbsp; ~ 높낮이 있게 길게 &nbsp;·&nbsp; r 혀를 굴림 &nbsp;·&nbsp; . 끊어 읽기</p>
</header>

<div id="scroll"><div id="text"></div></div>

<div id="panel">
  <div id="bar"><div id="barFill"></div></div>

  <div class="row">
    <button id="btnRestart" title="처음으로">⟲ 처음</button>
    <button id="btnPlay" class="primary">독송 시작</button>
    <button id="btnLoop">반복</button>
    <button id="btnMore">설정 ⚙</button>
  </div>

  <div class="row">
    <span id="timeLabel">0:00 / 0:00</span>
    <button id="btnCal">달력</button>
    <span id="cntBadge"></span>
    <span id="syncBadge"></span>
  </div>
</div>

<div id="more">
  <div class="row">
    <button id="btnAudio">음원 불러오기</button>
    <span id="fileName"></span>
    <button id="btnSync" disabled>싱크 맞추기</button>
  </div>

  <div class="row">
    <button id="btnSyncExport">싱크 내보내기</button>
    <button id="btnSyncImport">싱크 가져오기</button>
  </div>

  <div class="row">
    <label class="small">배속</label>
    <button class="spd" data-r="0.75">0.75×</button>
    <button class="spd on" data-r="1">1×</button>
    <button class="spd" data-r="1.25">1.25×</button>
    <button class="spd" data-r="1.5">1.5×</button>
    <button class="spd" data-r="2">2×</button>
  </div>

  <div class="row">
    <button id="btnWake">화면 켜짐 유지</button>
    <label class="small">테마
      <select id="themeSel">
        <option value="night">감지금니 (밤)</option>
        <option value="light">백지금니 (낮)</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label class="small">소요 시간
      <input type="text" id="durInput" value="1:00" inputmode="numeric" title="분:초">
    </label>
    <label class="small">글자 크기
      <input type="range" id="fontSize" min="1.2" max="3.4" step="0.1" value="2">
    </label>
    <button id="btnEdit">경문 편집</button>
  </div>
  <button class="close" id="moreClose">닫기</button>
</div>

<div id="recBar">
  <p class="hint">음원을 들으시며, 표시된 줄의 <b>첫 음이 시작되는 순간</b> 버튼을 눌러 주세요. (스페이스바도 가능)</p>
  <button id="recTap">이 줄 시작 ⏺</button>
  <div class="sub">
    <button id="recPause">⏸ 일시정지</button>
    <button id="recUndo">한 줄 뒤로</button>
    <button id="recDone">여기까지 저장</button>
    <button id="recCancel">취소</button>
  </div>
</div>

<div id="calOverlay">
  <div id="calCard">
    <div id="calHead">
      <button id="calPrev">‹</button>
      <h2 id="calTitle"></h2>
      <button id="calNext">›</button>
    </div>
    <div id="calGrid"></div>
    <div id="calStats"></div>
    <div id="calEdit">
      <span id="calEditDate"></span>
      <button id="calMinus">−</button>
      <b id="calEditCnt">0독</b>
      <button id="calPlus">＋</button>
    </div>
    <div id="rangeBox">
      <div class="rrow"><input type="date" id="rgFrom"> ~ <input type="date" id="rgTo"></div>
      <div id="rgResult"></div>
    </div>
  </div>
  <button id="calClose">닫기</button>
</div>

<input type="file" id="audioFile" accept="audio/*,video/mp4" hidden>
<input type="file" id="syncFile" accept="application/json,.json" hidden>
<audio id="audio" hidden></audio>

<div id="editor">
  <h2>경문 편집</h2>
  <textarea id="editArea" spellcheck="false"></textarea>
  <div class="row">
    <button id="editCancel">취소</button>
    <button id="editSave" class="primary">저장</button>
  </div>
  <p class="hint">평소 독송하시는 판본(전문 또는 심주)을 그대로 붙여 넣어 주세요.<br>줄바꿈은 그대로 유지됩니다.</p>
</div>

const textEl=$('text'), scrollEl=$('scroll'), audio=$('audio');

let chars=[];            // span 목록 (공백 제외)
let lines=[];            // 독송 대상 줄: {el, startChar, count}
let mantra=DEFAULT_TEXT;

/* ── 경문 렌더 ── */
function render(){
  textEl.innerHTML=''; chars=[]; lines=[];
  mantra.split('\n').forEach(line=>{
    if(line.trim()===''){
      const g=document.createElement('span'); g.className='gap';
      textEl.appendChild(g); return;
    }
    if(line.trimStart().startsWith('#')){
      const h=document.createElement('span'); h.className='hd';
      h.textContent=line.replace(/^\s*#+\s*/,'');
      textEl.appendChild(h); return;
    }
    const ln=document.createElement('span'); ln.className='ln';
    const startChar=chars.length;
    for(const c of line){
      if(c===' '){ ln.appendChild(document.createTextNode(' ')); continue; }
      const s=document.createElement('span'); s.className='ch'; s.textContent=c;
      ln.appendChild(s); chars.push(s);
    }
    textEl.appendChild(ln);
    if(chars.length>startChar) lines.push({el:ln,startChar,count:chars.length-startChar});
  });
  curIdx=-1; paint(0);
}

/* ── 진행률(0~1) → 글자 색칠 ── */
function paint(p){
  const n=chars.length; if(!n) return;
  const f=Math.min(Math.max(p,0),1)*n;
  const idx=Math.min(Math.floor(f), n-1);
  if(idx!==curIdx){
    if(idx>curIdx){
      for(let i=Math.max(curIdx,0); i<idx; i++){ chars[i].classList.add('done'); chars[i].classList.remove('cur'); }
    }else{
      for(let i=idx; i<=Math.min(curIdx,n-1); i++){ chars[i].classList.remove('done','cur'); }
    }
    if(curIdx>=0 && curIdx<n) chars[curIdx].classList.remove('cur');
    if(p>0 && p<1){
      chars[idx].classList.add('cur');
      const r=chars[idx].getBoundingClientRect(), sr=scrollEl.getBoundingClientRect();
      if(r.top<sr.top+sr.height*.25||r.bottom>sr.top+sr.height*.6)
        chars[idx].scrollIntoView({block:'center'});
    }
    if(p>=1){ chars[n-1].classList.add('done'); chars[n-1].classList.remove('cur'); }
    curIdx=idx;
  }
  barFill.style.width=(p*100)+'%';
}

/* ── 시간 표기 ── */
const fmt=t=>{t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
function dur(){ return useAudio ? (audio.duration||0) : manualDur; }
function pos(){ return useAudio ? audio.currentTime : manualT; }
function updateTime(){ $('timeLabel').textContent = fmt(pos())+' / '+fmt(dur()); }

/* ── 시간(초) → 진행률(0~1): 싱크가 있으면 줄별 시각 기준 ──
   부분 싱크(done<전체)면 미기록 구간은 글자 수 비례로 자동 배분 */
let effCache=null, effKey='';
function getEff(){
  if(!sync) return null;
  const done=sync.done ?? sync.times.length;
  const d=dur();
  const key=done+':'+sync.times.length+':'+d.toFixed(1);
  if(effKey===key) return effCache;
  const T=new Array(lines.length);
  for(let i=0;i<done && i<lines.length;i++) T[i]=sync.times[i];
  if(done<lines.length){
    const t0=done>0? sync.times[done-1] : 0;
    const sc=lines[done]?lines[done].startChar:chars.length;
    const remainChars=Math.max(chars.length-sc,1);
    const remainTime=Math.max(d-t0-1,1);
    for(let i=done;i<lines.length;i++)
      T[i]=t0+1+((lines[i].startChar-sc)/remainChars)*remainTime;
  }
  effCache=T; effKey=key;
  return T;
}
function progFromTime(t){
  const d=dur(); if(!d) return 0;
  if(!(useAudio && sync && sync.times.length)) return t/d;
  const T=getEff(), n=lines.length;
  if(t<=T[0]) return 0;
  let li=0;
  for(let i=n-1;i>=0;i--){ if(T[i]!=null && T[i]<=t){ li=i; break; } }
  const start=T[li];
  const end=(li+1<n && T[li+1]!=null)? T[li+1] : d;
  const frac=Math.min((t-start)/Math.max(end-start,.05),1);
  const cp=lines[li].startChar + frac*lines[li].count;
  return Math.min(cp/chars.length,1);
}

/* ── 재생 루프 ── */
function tick(ts){
  if(!playing) return;
  if(!useAudio){
    if(lastFrame) manualT += (ts-lastFrame)/1000*rate;
    lastFrame=ts;
    if(manualT>=manualDur){
      countRead();
      if(loop){ manualT=0; paint(0); }
      else { manualT=manualDur; stop(true); }
    }
  }else if(audio.ended){
    countRead();
    if(loop){ audio.currentTime=0; audio.play(); }
    else { stop(true); }
  }
  paint(progFromTime(pos()));
  updateTime();
  if(playing) requestAnimationFrame(tick);
}
function start(){
  playing=true; lastFrame=0;
  btnPlay.textContent='잠시 멈춤';
  if(useAudio) audio.play();
  if(setg.wake) holdWake(true);
  requestAnimationFrame(tick);
}
function stop(finished){
  playing=false; btnPlay.textContent= finished ? '다시 독송' : '독송 계속';
  if(useAudio) audio.pause();
  holdWake(false);
}
btnPlay.onclick=()=>{
  if(playing){ stop(false); return; }
  if(pos()>=dur()-.05){ if(useAudio) audio.currentTime=0; else manualT=0; paint(0); }
  start();
};

});

/* ── 음원 (IndexedDB에 저장하여 다음에 자동 복원) ── */
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('surangama-db',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbSet(k,v){
  try{ const db=await idbOpen();
    return new Promise(res=>{
      const tx=db.transaction('kv','readwrite');
      tx.objectStore('kv').put(v,k);
      tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
    });
  }catch(e){ return false; }
}
async function idbGet(k){
  try{ const db=await idbOpen();
    return new Promise(res=>{
      const rq=db.transaction('kv').objectStore('kv').get(k);
      rq.onsuccess=()=>res(rq.result??null); rq.onerror=()=>res(null);
    });
  }catch(e){ return null; }
}
function applyAudio(name,src){
  audio.src=src;
  useAudio=true;
  $('fileName').textContent=name;
  $('btnSync').disabled=false;
  audio.onloadedmetadata=()=>{ $('durInput').value=fmt(audio.duration); updateTime(); };
  stop(false); paint(0);
  btnPlay.textContent='독송 시작';
  loadSync(name);
}
$('btnAudio').onclick=()=>$('audioFile').click();
$('audioFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  applyAudio(f.name, URL.createObjectURL(f));
  const ok=await idbSet('audio',{name:f.name, blob:f});
  if(ok) $('fileName').textContent=f.name+' 💾';
};
async function restoreAudio(){
  const saved=await idbGet('audio');
  if(saved && saved.blob){
    applyAudio(saved.name+' 💾', URL.createObjectURL(saved.blob));
  }
}

/* ── 싱크 저장/불러오기 (Claude 환경: window.storage / 일반 브라우저: localStorage) ── */
async function kvSet(k,v){
  try{ if(window.storage){ await window.storage.set(k,v); return true; } }catch(e){}
  try{ localStorage.setItem(k,v); return true; }catch(e){}
  return false;
}
async function kvGet(k){
  try{ if(window.storage){ const r=await window.storage.get(k); if(r&&r.value!=null) return r.value; } }catch(e){}
  try{ return localStorage.getItem(k); }catch(e){}
  return null;
}
async function saveSync(silent){
  const ok=await kvSet('surangama-sync-v1',
    JSON.stringify({name:sync.name,count:lines.length,times:sync.times,done:sync.done}));
  effKey='';
  if(!ok && !silent) alert('이 브라우저에서는 자동 저장이 되지 않습니다.\n[싱크 내보내기]로 파일을 보관해 주세요.');
}
async function loadSync(name){
  sync=null; effKey=''; setBadge();
  try{
    const v=await kvGet('surangama-sync-v1');
    if(v){
      const d=JSON.parse(v);
      if(d.count===lines.length){ sync={name:d.name,times:d.times,done:d.done??d.times.length}; }
    }
  }catch(e){}
  setBadge();
}

$('btnSyncExport').onclick=()=>{

  const a=document.createElement('a');

};

      sync={name:d.name,times:d.times,done:d.done??d.times.length}; effKey=''; setBadge();

/* ── 싱크 녹화 모드 ── */
function recHighlight(){
  lines.forEach((l,i)=>{
    l.el.classList.toggle('reccur', i===recIdx);
    l.el.classList.toggle('recdone', i<recIdx);
  });
  if(lines[recIdx]) lines[recIdx].el.scrollIntoView({block:'center'});
}
function recStart(resume){
  if(!useAudio || !audio.duration) return;
  stop(false);
  recMode=true;
  if(resume && sync){
    recIdx=Math.min(sync.done??0, lines.length-1);
    recTimes=sync.times.slice(0,recIdx);
    audio.currentTime = recIdx>0 ? Math.max(recTimes[recIdx-1]-2,0) : 0;
  }else{
    recIdx=0; recTimes=[];
    audio.currentTime=0;
  }
  $('panel').style.display='none'; $('recBar').classList.add('open');
  chars.forEach(c=>c.classList.remove('done','cur')); curIdx=-1;
  $('recPause').textContent='⏸ 일시정지';
  audio.play();
  recHighlight();
}
function recExit(){
  recMode=false; audio.pause();
  $('panel').style.display=''; $('recBar').classList.remove('open');
  lines.forEach(l=>l.el.classList.remove('reccur','recdone'));
  audio.currentTime=0; paint(0); updateTime(); btnPlay.textContent='독송 시작';
}
function savePartial(){
  sync={name:$('fileName').textContent, times:recTimes.slice(), done:recTimes.length};
  saveSync(true); setBadge();
}
function recFinish(){
  if(recTimes.length) savePartial();
  recExit();
}
$('btnSync').onclick=()=>{
  closeMore();
  const done=sync? (sync.done??sync.times.length) : 0;
  if(sync && done>0 && done<lines.length){
    if(confirm('지난번에 '+done+'번째 줄까지 맞추셨습니다.\n\n[확인] 이어서 맞추기\n[취소] 처음부터 다시')){
      recStart(true); return;
    }
  }
  recStart(false);
};
$('recPause').onclick=()=>{
  if(!recMode) return;
  if(audio.paused){ audio.play(); $('recPause').textContent='⏸ 일시정지'; }
  else { audio.pause(); $('recPause').textContent='▶ 계속'; }
};
$('recTap').onclick=()=>{
  if(!recMode || audio.paused) return;
  recTimes[recIdx]=audio.currentTime;
  recIdx++;
  savePartial();          /* 탭할 때마다 자동 저장 */
  if(recIdx>=lines.length){ recFinish(); return; }
  recHighlight();
};
$('recUndo').onclick=()=>{
  if(!recMode||recIdx===0) return;
  recIdx--; recTimes.length=recIdx;
  savePartial();
  audio.currentTime=Math.max((recTimes[recIdx-1]??0)-1,0);
  recHighlight();
};

};
$('themeSel').onchange=e=>{ setg.theme=e.target.value; saveSet(); applySet(); };

/* ═══ 독송 기록 ═══ */
let rlog={};   /* {'YYYY-MM-DD': 독수} */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function loadLog(){
  try{ const v=await kvGet('surangama-log-v1'); if(v) rlog=JSON.parse(v)||{}; }catch(e){}
  updateCnt();
}
async function countRead(){
  const t=ymd(new Date());
  rlog[t]=(rlog[t]||0)+1;
  await kvSet('surangama-log-v1',JSON.stringify(rlog));
  updateCnt();
}
function updateCnt(){
  const c=rlog[ymd(new Date())]||0;
  $('cntBadge').textContent = c>0 ? '오늘 '+c+'독' : '';
}

/* ═══ 달력 ═══ */
let calY, calM, selDay=null;
function openCal(){
  const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); selDay=null;
  if(!$('rgFrom').value){
    $('rgFrom').value=calY+'-'+String(calM+1).padStart(2,'0')+'-01';
    $('rgTo').value=ymd(n);
  }
  drawCal(); rangeStats(); $('calOverlay').classList.add('open');
}
function drawCal(){
  $('calTitle').textContent=calY+'년 '+(calM+1)+'월';
  const g=$('calGrid'); g.innerHTML='';
  '일월화수목금토'.split('').forEach((d,i)=>{
    const e=document.createElement('div');
    e.className='dow'+(i===0?' sun':''); e.textContent=d; g.appendChild(e);
  });
  const first=new Date(calY,calM,1), start=first.getDay();
  const dim=new Date(calY,calM+1,0).getDate();
  const today=ymd(new Date());
  let mDays=0, mCnt=0;
  for(let i=0;i<start;i++){ const e=document.createElement('div'); e.className='day out'; g.appendChild(e); }
  for(let d=1;d<=dim;d++){
    const key=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const cnt=rlog[key]||0;
    if(cnt>0){ mDays++; mCnt+=cnt; }
    const e=document.createElement('div');
    e.className='day'+(cnt>0?' done':'')+(key===today?' today':'')+(key===selDay?' sel':'');
    e.innerHTML='<span>'+d+'</span><span class="mark">'+(cnt>0?cnt:'')+'</span>';
    e.onclick=()=>{ selDay=key; drawCal(); };
    g.appendChild(e);
  }
  let streak=0; const t=new Date();
  for(;;){ const k=ymd(t); if((rlog[k]||0)>0){ streak++; t.setDate(t.getDate()-1); } else break; }
  let total=0; for(const k in rlog) total+=rlog[k];
  $('calStats').innerHTML='이번 달 <b>'+mDays+'일</b>, <b>'+mCnt+'독</b>'
    +' · 지금까지 모두 <b>'+total+'독</b> 하셨습니다.'
    +(streak>0? '<br>오늘까지 <b>'+streak+'일</b> 연속입니다. 🪷':'');
  const ed=$('calEdit');
  if(selDay){
    ed.classList.add('open');
    const[y,m,dd]=selDay.split('-');
    $('calEditDate').textContent=(+m)+'월 '+(+dd)+'일';
    $('calEditCnt').textContent=(rlog[selDay]||0)+'독';
  }else ed.classList.remove('open');
}
async function adjustDay(delta){
  if(!selDay) return;
  const v=Math.max((rlog[selDay]||0)+delta,0);
  if(v===0) delete rlog[selDay]; else rlog[selDay]=v;
  await kvSet('surangama-log-v1',JSON.stringify(rlog));
  updateCnt(); drawCal(); rangeStats();
}
function rangeStats(){
  const f=$('rgFrom').value, t=$('rgTo').value, out=$('rgResult');
  if(!f||!t){ out.innerHTML='기간을 선택해 주세요.'; return; }
  const d1=new Date(f+'T00:00:00'), d2=new Date(t+'T00:00:00');
  if(d1>d2){ out.innerHTML='시작일이 종료일보다 늦습니다.'; return; }
  let cnt=0, days=0, span=0;
  for(const d=new Date(d1); d<=d2; d.setDate(d.getDate()+1)){
    span++;
    const c=rlog[ymd(d)]||0;
    if(c>0){ days++; cnt+=c; }
  }
  out.innerHTML=span+'일 동안 <b>'+cnt+'독</b> 하셨습니다.'
    +'<br>독송한 날 <b>'+days+'일</b> · 하루 평균 <b>'+(days?(cnt/span).toFixed(1):0)+'독</b>';
}
$('btnCal').onclick=()=>{ closeMore(); openCal(); };
$('calClose').onclick=()=>$('calOverlay').classList.remove('open');
$('calOverlay').addEventListener('click',e=>{ if(e.target===$('calOverlay')) $('calOverlay').classList.remove('open'); });
$('calPrev').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} selDay=null; drawCal(); };
$('calNext').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} selDay=null; drawCal(); };
$('calMinus').onclick=()=>adjustDay(-1);
$('calPlus').onclick=()=>adjustDay(1);
$('rgFrom').onchange=rangeStats;
$('rgTo').onchange=rangeStats;

render(); updateTime();
restoreAudio();
loadSet(); loadLog();
</script>
</body>
</html>
